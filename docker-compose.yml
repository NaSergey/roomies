services:
  db:
    image: postgres:16-alpine
    container_name: roomies-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: roomies
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - roomies-db-data:/var/lib/postgresql/data

volumes:
  roomies-db-data:
